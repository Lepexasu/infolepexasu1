<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lepexasu | Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a050a;
      --accent: #ff2d95;                     
      --accent-soft: rgba(255, 45, 149, .35);
      --accent-faint: rgba(255, 45, 149, .06);
      --card-bg: rgba(20, 8, 16, .88);
      --text: #fff0f8;
      --muted: #8a9bb8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(255,45,149,.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 60%, rgba(255,120,200,.07) 0%, transparent 45%),
        linear-gradient(180deg, #080408 0%, #120812 40%, #160a14 100%);
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image:
        linear-gradient(var(--accent-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent-faint) 1px, transparent 1px);
      background-size: 40px 40px;
    }


    html::after {
      content: " ";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 100;
    }

    .main-container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 34px;
    }

 
    .photo-row {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: flex-start;
    }

    .photo {
      flex: 1;
      width: 0;
      position: relative;
      filter: drop-shadow(0 12px 25px rgba(0,0,0,.55));
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), filter .3s ease;
    }
    .photo:nth-child(1) { transform: rotate(-2deg); }
    .photo:nth-child(2) { transform: rotate(2deg); margin-top: 24px; }

    .photo:hover {
      transform: translateY(-10px) rotate(0) scale(1.04);
      filter: drop-shadow(0 18px 35px rgba(255,45,149,.2));
      z-index: 2;
    }

    .photo::before, .photo::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border: 2px solid var(--accent);
      opacity: .8;
      pointer-events: none;
      z-index: 3;
    }
    .photo::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
    .photo::after  { right: -5px; bottom: -5px; border-left: 0; border-top: 0; }

    .polaroid {
      background: #fff0f8;
      padding: 4% 4% 14%;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(255,45,149,.9) inset, 0 4px 12px rgba(0,0,0,.35);
    }
    .polaroid img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #1a0a14;
    }


    .card {
      position: relative;
      width: 100%;
      padding: 34px 26px 30px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--accent-soft);
      box-shadow:
        0 0 30px rgba(255,45,149,.08),
        inset 0 0 40px rgba(0,0,0,.4);
    }
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border: 2px solid var(--accent);
      pointer-events: none;
    }
    .card::before { top: -6px; left: -6px; border-right: 0; border-bottom: 0; }
    .card::after  { right: -6px; bottom: -6px; border-left: 0; border-top: 0; }

    h1 {
      display: inline-block;
      font-family: 'VT323', monospace;
      font-size: clamp(2.8rem, 10vw, 4rem);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 14px;
    }


    .blink { animation: blinker 1s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }

    .bio-text {
      font-family: 'Orbitron', sans-serif;
      font-size: .85rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--accent);
      opacity: .9;
      margin-bottom: 28px;
    }

    .nav-label {
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(255,45,149,.4);
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    .social-block { display: flex; flex-direction: column; gap: 12px; }

    .link-btn {
      display: block;
      padding: 13px 10px;
      border: 1.5px solid var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-align: center;
      background: rgba(255,45,149,.03);
      transition: transform .2s ease, background .25s, color .25s, box-shadow .25s, border-color .25s;
    }
    .link-btn:hover, .link-btn:focus-visible {
      background: var(--accent);
      color: #1a0412;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(255,45,149,.55);
      transform: scale(1.04);
      outline: none;
    }

 
    .info-block { text-align: left; margin-bottom: 22px; }

    .data-item {
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      margin-bottom: 10px;
      background: rgba(255,45,149,.06);
      transition: background .25s, transform .25s;
    }
    .data-item:hover {
      background: rgba(255,45,149,.12);
      transform: translateX(5px);
    }
    .label {
      display: block;
      margin-bottom: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: .65rem;
      letter-spacing: 3px;
      color: #b88aa8;
    }
    .value {
      display: block;
      font-family: 'VT323', monospace;
      font-size: 1.7rem;
      line-height: 1.1;
      color: var(--text);
      transform-origin: left center;
      transition: transform .3s ease-in-out, color .3s;
    }
    .data-item:hover .value {
      transform: scale(1.2);
      color: var(--accent);
    }

    .disconnect-btn {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 26px;
      border: 1.5px solid var(--accent-soft);
      background: none;
      color: #b88aa8;
      font-family: 'Orbitron', sans-serif;
      font-size: .75rem;
      letter-spacing: 4px;
      cursor: pointer;
      transition: transform .2s ease, color .25s, border-color .25s, box-shadow .25s;
    }
    .disconnect-btn:hover, .disconnect-btn:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(255,45,149,.45);
      transform: scale(1.04);
      outline: none;
    }


    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .polaroid { animation: fadeIn 1s ease-out; }
    .card     { animation: fadeIn .8s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      .polaroid, .card { animation: none; }
    }

  
    .card .bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .6;
    }

    @media (max-width: 480px) {
      .photo-row { gap: 12px; }
      .card { padding: 28px 16px 24px; }
      .bio-text { letter-spacing: 3px; font-size: .75rem; }
      .link-btn { letter-spacing: 3px; }
    }
  </style>
</head>
<body>

</body>
</html>
